name: Add or correct a rule
description: A tell RULES.md misses, or a replacement that is wrong.
title: "[rule] "
labels: ["rules"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What is this
      options:
        - A tell that is missing
        - A replacement that is wrong or weak
        - A category or explanation that is wrong
    validations:
      required: true
  - type: input
    id: tell
    attributes:
      label: The tell
      placeholder: "\"in a very real sense\""
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: Proposed editing action
      description: Give a safe replacement or explain what the writer should review manually.
      placeholder: Explain when a replacement is appropriate.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Where have you seen it cluster? A link to a rule set that already documents it is ideal.
    validations:
      required: false
  - type: textarea
    id: humanuse
    attributes:
      label: When would a human write this legitimately
      description: Give a legitimate use as well as an example that needs editing.
    validations:
      required: true
