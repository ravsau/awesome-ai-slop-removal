name: Tool feedback
description: The score felt wrong, something broke, or an output was bad.
title: "[tool] "
labels: ["tool-feedback"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool
      options:
        - Slop Score (enhancepost.com/slopscore)
        - EnhancePost enhancer
        - The slop words list article
        - RULES.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - The score felt too high
        - The score felt too low
        - It missed slop that is obviously there
        - A rewrite changed my meaning
        - Something broke or did not load
        - A suggestion
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: What happened
      description: If a score was involved, paste the text and the number you got.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 18, iPhone
    validations:
      required: false
