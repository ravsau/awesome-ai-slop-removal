name: Tool feedback
description: A suggestion was unclear, something broke, or an edit changed the meaning.
title: "[tool] "
labels: ["tool-feedback"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool
      options:
        - Anti-Slop Editor (enhancepost.com/antislop)
        - The slop words list article
        - RULES.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - A rule flagged appropriate writing
        - A rule explanation was unclear
        - It missed a listed pattern
        - An accepted edit changed my meaning
        - Something broke or did not load
        - A suggestion
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: What happened
      description: Include the rule ID and a short non-confidential example. Do not paste private drafts or personal details.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 18, iPhone
    validations:
      required: false
